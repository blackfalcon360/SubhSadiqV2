plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackfalcon.subhsadiq'
    compileSdk 34

    defaultConfig {
        applicationId "Subhsadiq.blackfalcon.jan"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
